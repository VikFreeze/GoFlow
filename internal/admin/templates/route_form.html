{{define "route_form"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GoFlow — {{if .Name}}edit {{.Name}}{{else}}add route{{end}}</title>
  <style>{{template "css" .}}</style>
</head>
<body>
  {{template "topbar" .}}
  <main>
    <div class="card narrow" style="max-width: 560px">
      <h2>{{if .Name}}Edit route: {{.Name}}{{else}}Add route{{end}}</h2>
      <form method="post" action="/admin/routes">
        <label for="name">Name (unique identifier)</label>
        <input id="name" name="name" value="{{if .Route}}{{.Route.Name}}{{else}}{{.Name}}{{end}}" required>

        <label for="hosts">Hosts (comma-separated; first is primary, rest are aliases)</label>
        <input id="hosts" name="hosts" placeholder="files.dev.test, shares.dev.test"
               value="{{if .Route}}{{join .Route.Hosts ", "}}{{end}}" required>

        <label for="backend">Backend (host:port)</label>
        <input id="backend" name="backend" placeholder="127.0.0.1:41240"
               value="{{if .Route}}{{.Route.Backend}}{{end}}" required>

        <label for="allowlist">Source-IP allowlist (comma-separated CIDR; empty = allow all)</label>
        <input id="allowlist" name="allowlist" placeholder="192.168.0.0/16, 10.0.0.0/8"
               value="{{if .Route}}{{join .Route.Allowlist ", "}}{{end}}">

        <label for="tlsCertFile">TLS cert file (PEM, relative to config dir)</label>
        <input id="tlsCertFile" name="tlsCertFile" value="{{if .Route}}{{.Route.TLSCertFile}}{{end}}">

        <label for="tlsKeyFile">TLS key file (PEM)</label>
        <input id="tlsKeyFile" name="tlsKeyFile" value="{{if .Route}}{{.Route.TLSKeyFile}}{{end}}">

        <label class="row" style="margin-top: 0.9rem">
          <input type="checkbox" name="acme" style="width:auto"
                 {{if .Route}}{{if .Route.ACME}}checked{{end}}{{end}}>
          ACME / Let's Encrypt (HTTP-01)
        </label>
        <label class="row">
          <input type="checkbox" name="redirectHttp" style="width:auto"
                 {{if .Route}}{{if .Route.RedirectHTTP}}checked{{end}}{{end}}>
          Redirect HTTP to HTTPS
        </label>

        <div class="row" style="margin-top: 1.25rem">
          <button type="submit">Save</button>
          <a class="btn secondary" href="/admin/routes" style="border:1px solid var(--border);padding:0.5rem 1rem;display:inline-block">Cancel</a>
        </div>
      </form>
    </div>
  </main>
</body>
</html>{{end}}
